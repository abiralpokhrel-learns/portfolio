name: Replace index.html with new homepage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html and verify diff
        run: |
          set -e
          ls -l
          test -f personal-website.html
          test -f index.html
          grep -q "175 tests" index.html
          grep -q "194 tests" personal-website.html
          test "$(grep -c "194 tests" personal-website.html)" = "2"
          rm index.html
          mv personal-website.html index.html
          rm -rf .github
          git status --short
          git add -A
          echo "--- staged files ---"
          git diff --cached --name-status
          echo "--- staged diff stat ---"
          git diff --cached --stat
          echo "--- staged diff of index.html ---"
          git diff --cached -- index.html
          test "$(grep -c "194 tests" index.html)" = "2"
          if grep -q "175 tests" index.html; then echo "ERROR: index.html still contains 175 tests"; exit 1; fi
          git diff --cached -U0 -- index.html | grep '^[-+]' | grep -v '^---' | grep -v '^+++' > /tmp/changed.txt || true
          echo "--- changed lines ---"
          cat /tmp/changed.txt
          if grep -v -E '175 tests|194 tests' /tmp/changed.txt; then echo "ERROR: diff contains lines other than the test-count lines"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update query-engine test count 175 to 194"
          git push
